name: trufit_bodamma
description: "Sthira - Personal Fitness Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  firebase_core: ^3.8.0
  firebase_analytics: ^11.3.3
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  google_sign_in: ^6.2.1
  go_router: ^14.8.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  fl_chart: ^0.70.2
  youtube_player_iframe: ^6.0.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  googleai_dart: ^11.0.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.2.3
  health: ^13.3.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  package_info_plus: ^9.0.1
  archive: ^4.0.9
  file_picker: 8.3.7
  share_plus: ^12.0.2
  image_cropper: ^12.2.1
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  connectivity_plus: ^7.3.1
  encrypt: ^5.0.3
  crypto: ^3.0.7
  csv: ^8.0.0
  flutter_timezone: ^5.1.0
  wakelock_plus: ^1.2.8
  flutter_animate: ^4.5.2
  pointycastle: ^3.9.1
  image: ^4.9.2
  home_widget: ^0.9.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  isar_generator: ^3.1.0+1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

  hive: any
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/icon/
    - assets/avatars/
  fonts:
    - family: Cabinet Grotesk
      fonts:
        - asset: assets/fonts/CabinetGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/CabinetGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/CabinetGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/CabinetGrotesk-Bold.ttf
          weight: 700
        - asset: assets/fonts/CabinetGrotesk-Extrabold.ttf
          weight: 800
        - asset: assets/fonts/CabinetGrotesk-Black.ttf
          weight: 900
    - family: General Sans
      fonts:
        - asset: assets/fonts/GeneralSans-Light.ttf
          weight: 300
        - asset: assets/fonts/GeneralSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeneralSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeneralSans-Semibold.ttf
          weight: 600
        - asset: assets/fonts/GeneralSans-Bold.ttf
          weight: 700
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/sunflower_menu_logo_1024.png"
